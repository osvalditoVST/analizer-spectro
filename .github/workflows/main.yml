name: Build Genre Spectrum VST3

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: GenreSpectrum
    steps:
      - uses: actions/checkout@v4

      - name: Configurar
        run: cmake -B build -G "Visual Studio 17 2022" -A x64

      - name: Compilar
        run: cmake --build build --config Release --parallel

      - name: Empaquetar
        shell: pwsh
        run: |
          $v = Get-ChildItem build -Recurse -Directory -Filter "*.vst3" | Select-Object -First 1
          if (-not $v) { throw "No se encontro el .vst3" }
          New-Item -ItemType Directory -Force "dist/Genre Spectrum" | Out-Null
          Copy-Item $v.FullName "dist/Genre Spectrum/" -Recurse
          Copy-Item installer/install.bat, installer/uninstall.bat, installer/LEEME.txt "dist/Genre Spectrum/"

      - name: Instalador exe opcional
        continue-on-error: true
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer\GenreSpectrum.iss

      - uses: actions/upload-artifact@v4
        with:
          name: Genre-Spectrum-VST3-Win64
          path: GenreSpectrum/dist
